# SSH deploy to a DigitalOcean Droplet whenever code lands on main
# (push or merge). Pulls latest code, installs deps, builds, restarts PM2.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          — Droplet IP or hostname
#   SSH_USER          — SSH user (e.g. root or deploy)
#   SSH_PRIVATE_KEY   — Private key (PEM) authorized on the Droplet
#
# Optional:
#   DEPLOY_PATH       — App directory on the Droplet
#                       (default: $HOME/eisy-myanmar-card)

name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: digitalocean-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy (git pull, build, pm2 restart all)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "${APP_DIR}" ]; then
              APP_DIR="$HOME/eisy-myanmar-card"
            fi

            echo "==> Deploying into ${APP_DIR}"
            if [ ! -d "${APP_DIR}" ]; then
              echo "ERROR: ${APP_DIR} does not exist. Clone the repo on the Droplet first:"
              echo "  git clone <repo-url> ${APP_DIR}"
              exit 1
            fi
            cd "${APP_DIR}"

            if [ ! -d .git ]; then
              echo "ERROR: ${APP_DIR} is not a git repository."
              exit 1
            fi

            echo "==> Pulling latest code from origin/main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "==> Installing root dependencies"
            npm install

            echo "==> Building project (portal HTML, public assets)"
            npm run build

            echo "==> Installing backend dependencies"
            npm install --prefix backend

            echo "==> Restarting all PM2 processes"
            pm2 restart all
            pm2 save
            pm2 status

            echo "==> Deploy complete"
