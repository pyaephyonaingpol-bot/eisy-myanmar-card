# SSH deploy to a DigitalOcean Droplet on every push to main.
#
# Required GitHub repository secrets:
#   SSH_HOST          — Droplet IP or hostname
#   SSH_USER          — SSH user (e.g. root or deploy)
#   SSH_PRIVATE_KEY   — Private key (PEM) authorized on the Droplet
#
# Optional secrets:
#   DEPLOY_PATH       — App directory on the server (default: ~/eisy-myanmar-card)
#   PM2_APP_NAME      — PM2 process name (default: eisy-backend)

name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

concurrency:
  group: digitalocean-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy (git pull, build, PM2)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "${APP_DIR}" ]; then
              APP_DIR="$HOME/eisy-myanmar-card"
            fi

            PM2_APP_NAME="${{ secrets.PM2_APP_NAME }}"
            if [ -z "${PM2_APP_NAME}" ]; then
              PM2_APP_NAME="eisy-backend"
            fi

            echo "==> Deploying into ${APP_DIR}"
            mkdir -p "${APP_DIR}"
            cd "${APP_DIR}"

            if [ ! -d .git ]; then
              echo "ERROR: ${APP_DIR} is not a git repository. Clone the repo on the Droplet first."
              exit 1
            fi

            echo "==> Updating code from origin/main"
            git checkout main
            git pull origin main

            echo "==> Installing root dependencies"
            npm install

            echo "==> Building (portal HTML, public assets)"
            npm run build

            echo "==> Installing backend dependencies"
            npm install --prefix backend

            echo "==> Restarting PM2: ${PM2_APP_NAME}"
            if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then
              pm2 restart "${PM2_APP_NAME}" --update-env
            else
              cd backend
              if [ -f server.js ]; then
                pm2 start server.js --name "${PM2_APP_NAME}"
              else
                pm2 start src/index.js --name "${PM2_APP_NAME}"
              fi
            fi

            pm2 save
            pm2 status "${PM2_APP_NAME}"
            echo "==> Deploy complete"
