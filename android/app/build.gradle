plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.eisymyanmar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eisymyanmar.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.1.3'

        // Production web app URL loaded by the shell WebView.
        // Override in local.properties: eisy.web.url=https://...
        def webUrl = localProps.getProperty('eisy.web.url', 'https://eisymyanmar.com')
        buildConfigField 'String', 'WEB_APP_URL', "\"${webUrl}\""

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug signing keeps local/CI APK installs simple; replace with a
            // release keystore for Play Store distribution.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
}
